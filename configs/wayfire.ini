[core]
plugins = autostart command decoration move resize place pixdecor

[pixdecor]
rounded_corner_radius = 12
border_size = 2

[autostart]
aurore = aurore-de
[command]
binding_launcher = <super>
command_launcher = aurore-burzellaunch
    padding: 0 16px;
    margin: 4px 0;
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.12);
}

#custom-launcher:hover {
    background-color: rgba(255, 255, 255, 0.25);
}

#clock {
    padding: 0 14px;
    font-size: 13px;
}
