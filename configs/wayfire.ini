[core]
plugins = autostart command decoration move resize place pixdecor

[pixdecor]
rounded_corner_radius = 12
border_size = 2

[autostart]
aurore = aurore-de
bar = sh -c 'mkdir -p ~/.cache/aurore && touch ~/.cache/aurore/color.css && ln -sf ~/.cache/aurore/color.css /tmp/aurore_active.css && exec waybar -c /etc/xdg/aurore/waybar.jsonc -s /etc/xdg/aurore/waybar.css'

[command]
binding_launcher = <super>
command_launcher = aurore-burzellaunch


5. configs/waybar.jsonc


{
    "layer": "top",
    "position": "bottom",
    "height": 42,
    "margin-bottom": 6,
    "margin-left": 12,
    "margin-right": 12,
    "modules-left": ["wlr/taskbar"],
    "modules-center": ["custom/launcher"],
    "modules-right": ["tray", "clock"],
    "custom/launcher": {
        "format": "⊞",
        "tooltip": false,
        "on-click": "aurore-burzellaunch"
    },
    "wlr/taskbar": {
        "format": "{icon}",
        "icon-size": 22,
        "on-click": "activate"
    },
    "clock": {
        "format": "{:%H:%M}"
    }
}

6. configs/waybar.css

@import url("/tmp/aurore_active.css");

window#waybar {
    background-color: @aurore_primary;
    color: #e8f3ec;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

#custom-launcher {
    font-size: 20px;
    padding: 0 16px;
    margin: 4px 0;
    border-radius: 8px;
    background-color: rgba(255, 255, 255, 0.12);
}

#custom-launcher:hover {
    background-color: rgba(255, 255, 255, 0.25);
}

#clock {
    padding: 0 14px;
    font-size: 13px;
}
